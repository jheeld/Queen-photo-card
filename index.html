<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b0d3a">
<title>Jheel's Birthday Card</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%91%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg1: #3b0d3a;
    --bg2: #7a1e4f;
    --gold: #f5c96a;
    --gold-dark: #c9962e;
    --ink: #2a0a24;
    --card: #ffffff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg1); }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #fff;
    background:
      radial-gradient(circle at 15% 10%, rgba(245, 201, 106, .25) 0 6px, transparent 7px),
      radial-gradient(circle at 85% 18%, rgba(255, 255, 255, .18) 0 4px, transparent 5px),
      radial-gradient(circle at 70% 60%, rgba(245, 201, 106, .18) 0 5px, transparent 6px),
      radial-gradient(circle at 10% 75%, rgba(255, 255, 255, .15) 0 4px, transparent 5px),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    background-attachment: fixed;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  h1 {
    margin: 4px 0 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(28px, 8vw, 38px);
    text-align: center;
    color: var(--gold);
    letter-spacing: .5px;
    text-shadow: 0 2px 10px rgba(0, 0, 0, .35);
  }
  .sub { margin: -8px 0 0; opacity: .85; font-size: 16px; text-align: center; }

  .stage {
    position: relative;
    /* keep the whole card plus the buttons on one phone screen */
    width: min(100%, 360px, max(280px, calc((100vh - 400px) * 630 / 1020)));
    width: min(100%, 360px, max(280px, calc((100svh - 400px) * 630 / 1020)));
    aspect-ratio: 630 / 1020;
    border-radius: 18px;
    box-shadow: 0 14px 40px rgba(0, 0, 0, .45), 0 0 0 3px rgba(245, 201, 106, .55);
    overflow: hidden;
    background: #fff;
  }
  #card {
    display: block;
    width: 100%;
    height: 100%;
    cursor: pointer;
  }
  #card.has-photo { cursor: grab; touch-action: none; }
  #card.dragging { cursor: grabbing; }
  .hint {
    position: absolute;
    left: 50%; bottom: 14%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, .55);
    color: #fff;
    font-size: 14px;
    padding: 7px 12px;
    border-radius: 999px;
    white-space: nowrap;
    pointer-events: none;
    transition: opacity .4s;
    opacity: 0;
  }
  .hint.show { opacity: 1; }

  .suits { display: flex; gap: 12px; justify-content: center; }
  .suit {
    width: 58px; height: 58px;
    border-radius: 50%;
    border: 3px solid transparent;
    background: #fff;
    display: grid; place-items: center;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(0, 0, 0, .3);
    transition: transform .15s, border-color .15s;
    padding: 0;
  }
  .suit svg { width: 34px; height: 34px; }
  .suit[aria-pressed="true"] { border-color: var(--gold); transform: scale(1.1); box-shadow: 0 0 0 4px rgba(245, 201, 106, .35), 0 6px 16px rgba(0, 0, 0, .35); }
  .suit:active { transform: scale(.95); }

  .themes { display: flex; gap: 8px; width: min(100%, 380px); background: rgba(0, 0, 0, .22); padding: 5px; border-radius: 18px; }
  .theme {
    flex: 1; min-height: 58px; border: 0; border-radius: 14px; cursor: pointer;
    background: transparent; color: #fff; font: 700 13px/1 inherit; font-family: inherit;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 4px 2px;
    transition: background .15s, color .15s;
  }
  .theme .ico { font-size: 20px; display: inline-grid; place-items: center; width: 24px; height: 24px; }
  .theme .ico svg { width: 24px; height: 24px; }
  .theme[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 3px 10px rgba(0, 0, 0, .25); }
  .pokemon-fields { width: min(100%, 380px); display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pokemon-fields label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; min-width: 0; }
  .pokemon-fields .wide { grid-column: 1 / -1; }
  .pokemon-fields input, .pokemon-fields select { width: 100%; padding: 10px; border: 1px solid var(--gold); border-radius: 9px; background: #fff; color: var(--ink); font: inherit; }
  .pokemon-fields label.inline-field { flex-direction: row; align-items: center; gap: 12px; }
  .inline-field input, .inline-field select { flex: 1; min-width: 0; }
  .category-options { width: min(100%, 380px); display: flex; align-items: center; gap: 12px; font-size: 14px; }
  .category-options label { flex: 1; }
  .category-options select { min-width: 175px; max-width: 60%; padding: 12px; border: 1px solid var(--gold); border-radius: 12px; background: #fff; color: var(--ink); font: inherit; }
  button:focus-visible, select:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }
  .tags-wrap { width: min(100%, 380px); display: flex; flex-direction: column; gap: 8px; }
  .tags-label { font-size: 14px; font-weight: 600; opacity: .85; text-align: center; }
  .tags { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .tag {
    min-height: 48px; border-radius: 12px; border: 3px solid transparent; cursor: pointer;
    font: 800 13px/1.1 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; padding: 4px;
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .tag[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(245, 201, 106, .35); }
  .t-classic { background: #fff; }
  .t-classic span { background: linear-gradient(45deg, #fa7e1e, #d62976, #962fbf, #4f5bd5); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .t-gradient { background: linear-gradient(45deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5) border-box; color: #fff; }
  .t-dark { background: rgba(0, 0, 0, .55); color: #fff; }
  .t-post { background: #fff; color: #262626; }
  .t-post i { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(#fff 45%, transparent 47%), linear-gradient(45deg, #feda75, #fa7e1e, #d62976, #962fbf); }
  .zoom { display: none; width: min(100%, 360px); align-items: center; gap: 10px; font-size: 20px; }
  .zoom.show { display: flex; }
  .zoom input { flex: 1; accent-color: var(--gold); height: 32px; }

  .buttons { display: flex; flex-direction: column; gap: 12px; width: min(100%, 360px); }
  .row { display: flex; gap: 12px; }
  .row > * { flex: 1; }
  .btn {
    appearance: none;
    border: 0;
    border-radius: 16px;
    min-height: 60px;
    padding: 14px 16px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform .1s, filter .15s;
    font-family: inherit;
  }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .45; cursor: default; transform: none; }
  .btn.primary { background: linear-gradient(180deg, var(--gold), var(--gold-dark)); color: var(--ink); box-shadow: 0 6px 16px rgba(0, 0, 0, .3); }
  .btn.secondary { background: rgba(255, 255, 255, .14); color: #fff; border: 2px solid rgba(255, 255, 255, .35); }
  .btn.big { min-height: 68px; font-size: 20px; }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
  label.btn { user-select: none; -webkit-user-select: none; }
  .hidden { display: none !important; }
  footer { opacity: .6; font-size: 13px; margin-top: 4px; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>👑 Queen of Hearts</h1>
  <p class="sub">Jheel's Birthday 2026 🎉</p>

  <div class="themes" role="group" aria-label="Pick a card style">
    <button class="theme" data-theme="queen" aria-pressed="true"><span class="ico">👑</span>Face cards</button>
    <button class="theme" data-theme="zodiac" aria-pressed="false"><span class="ico">♎︎</span>Zodiac</button>
    <button class="theme" data-theme="wingspan" aria-pressed="false"><span class="ico"></span>Wingspan</button>
    <button class="theme" data-theme="pokemon" aria-pressed="false"><span class="ico">⚡</span>Pokémon</button>
  </div>

  <div id="faceOptions" class="category-options">
    <label for="faceRank">Choose your face card</label>
    <select id="faceRank"><option value="Queen" selected>Queen · Q</option><option value="King">King · K</option><option value="Jack">Jack · J</option><option value="Ace">Ace · A</option></select>
  </div>

  <div id="categoryOptions" class="category-options hidden">
    <label id="optionLabel" for="variant">Choose your sign</label>
    <select id="variant"></select>
  </div>

  <div id="pokemonFields" class="pokemon-fields hidden">
    <label>Name<input id="pokemonName" maxlength="22" value="Jheel"></label>
    <label>HP<input id="pokemonHP" type="number" min="10" max="999" value="150"></label>
    <label>Type<select id="pokemonType"><option>Electric</option><option>Fire</option><option>Water</option><option>Grass</option><option>Psychic</option><option>Fighting</option><option>Dark</option><option>Fairy</option><option>Dragon</option><option>Normal</option></select></label>
    <label>Attack idea<select id="pokemonAttackPreset"><option>Yap Attack</option><option>Delulu Shield</option><option>Organized Chaos</option><option>Side Eye</option><option>Rice Bowl Reset</option><option>Lore Drop</option><option>Laughing Fit</option><option>Weaponized Charm</option><option>Power Nap</option><option>Receipts Ready</option><option>Trust Me, I Know a Spot</option><option>Selective Hearing</option><option>Matcha Boost</option><option selected>Side Quest</option><option>Double Text</option><option>Irish Goodbye</option><option>Spiral Session</option><option>Pep Talk</option><option>One Last Reel</option><option>Happy Dance</option><option>Custom</option></select></label>
    <label id="customAttackName" class="hidden">Attack name<input id="pokemonAttack" maxlength="30" value="Side Quest"></label>
    <label>Attack damage<input id="pokemonDamage" type="number" min="0" max="999" value="60"></label>
    <label class="wide">Attack description<input id="pokemonDescription" maxlength="90" value="Wander off the plan. Find unexpected little joys along the way."></label>
    <label>Weakness<select id="pokemonWeakness"><option>None</option><option>Overthinking</option><option>Low social battery</option><option>Sleep deprivation</option><option>Small talk</option><option>Monday mornings</option><option selected>Being hangry</option><option>Unread messages</option><option>Decision fatigue</option><option>Running late</option><option>Cute dogs</option><option>FOMO</option><option>Awkward silence</option><option>One more episode</option><option>Slow Wi-Fi</option><option>Doomscrolling</option></select></label>
    <label>Resistance drink<select id="pokemonResistance"><option>Chaas</option><option>Masala soda</option><option>Peppermint mocha</option><option>None</option><option>Coffee</option><option>Chai</option><option selected>Matcha</option><option>Water</option><option>Iced latte</option><option>Cold brew</option><option>Bubble tea</option><option>Hot chocolate</option><option>Lemonade</option><option>Sparkling water</option><option>Coconut water</option><option>Smoothie</option><option>Orange juice</option><option>Mocktail</option><option>Margarita</option><option>Wine</option><option>Beer</option></select></label>
    <label>Retreat cost<select id="pokemonRetreat"><option value="0">0 — Already in the Uber</option><option value="1" selected>1 — Let me say bye</option><option value="2">2 — After this song</option><option value="3">3 — Who said we’re leaving?</option><option value="4">4 — I live here now</option></select></label>

  </div>

  <div id="birdFields" class="pokemon-fields hidden">
    <label>Your name<input id="birdName" maxlength="26" value="Jheel"></label>
    <label class="wide inline-field">Habitat<select id="humanHabitat"><option>Cities</option><option>Mountains</option><option>Beaches</option><option>Rivers</option><option>Forests</option><option>Lakes</option><option>Countryside</option><option>Deserts</option><option>Islands</option><option>Parks</option><option>Cozy homes</option><option>Coffee shops</option></select></label>
    <label class="wide inline-field">Food<select id="humanFood"><option selected>Rice bowls</option><option>Birthday cake</option><option>Pizza</option><option>Sushi</option><option>Tacos</option><option>Pasta</option><option>Biryani</option><option>Dumplings</option><option>Noodles</option><option>Burgers</option><option>Fries</option><option>Ice cream</option><option>Chocolate</option><option>Chaat</option><option>Dosa</option><option>Pani puri</option><option>Ramen</option><option>Salad</option><option>Fruit</option></select></label>
    <label>Party role<select id="birdHabitat"><option>Social butterfly</option><option>Dance-floor legend</option><option>Snack enthusiast</option><option>Memory maker</option><option>Cozy companion</option><option>Hype human</option><option selected>Experience curator</option><option>Playlist curator</option><option>Cake connoisseur</option><option>Adventure buddy</option><option>Storyteller</option><option>Karaoke superstar</option><option>Game-night champion</option><option>Photo booth pro</option><option>Pun specialist</option><option>Thoughtful listener</option><option>Confetti captain</option><option>Outfit icon</option><option>Midnight philosopher</option><option>Group hug initiator</option><option>Surprise planner</option></select></label>
    <label>Vibe<select id="birdPoints"><option value="Free spirit">Free spirit — follows curiosity, skips the itinerary</option><option value="Secret softie">Secret softie — tough exterior, tender heart</option><option value="Chaotic good">Chaotic good — good intentions, unpredictable plans</option><option value="Straight shooter">Straight shooter — honest, direct, no guessing games</option><option value="Wildcard">Wildcard — full of delightful surprises</option><option value="Black cat" selected>Black cat — independent and selectively social</option><option value="Daydreamer">Daydreamer — imagination always wandering</option><option value="Golden retriever">Golden retriever — enthusiastic and loyal</option><option value="Quiet storm">Quiet storm — calm presence, strong opinions</option><option value="Playful menace">Playful menace — harmless mischief and inside jokes</option><option value="Cozy soul">Cozy soul — comfort, snacks, and familiar faces</option><option value="Plot twist">Plot twist — never quite what you expect</option><option value="Curious mind">Curious mind — always one question away from a rabbit hole</option><option value="Night owl">Night owl — best ideas arrive after dark</option><option value="Adventure buddy">Adventure buddy — turns a regular day into a story</option></select></label>
    <label class="wide">Your little talent<input id="birdAbility" maxlength="110" value="Always knows where to get good food."></label>
  </div>

  <div class="stage">
    <canvas id="card" width="630" height="1020" aria-label="Your card preview"></canvas>
    <div class="hint" id="hint">Drag to move · pinch to zoom</div>
  </div>

  <div class="zoom" id="zoomRow">
    <span aria-hidden="true">−</span>
    <input type="range" id="zoom" min="1" max="4" step="0.01" value="1" aria-label="Zoom">
    <span aria-hidden="true">+</span>
  </div>

  <div class="buttons">
    <div class="row">
      <label class="btn primary big" id="pickBtn" for="fileInput" role="button" tabindex="0" aria-describedby="photoHelp photoPrivacy">🖼️ Photos</label>
    </div>
    <p id="photoHelp" style="margin: 0; text-align: center; font-size: 14px; opacity: .85;">Send your pictures through AirDrop, then select them from Photos.</p>
    <p id="photoPrivacy" style="margin: 0; text-align: center; font-size: 13px; opacity: .75;">Your photo stays on this device.</p>
    <div class="row hidden" id="exportRow">
      <button class="btn primary" id="downloadBtn">⬇️ Download card</button>
      <button class="btn secondary hidden" id="shareBtn">📤 Share</button>
    </div>
  </div>

  <div class="suits" role="group" aria-label="Pick a suit">
    <button class="suit" data-suit="hearts" aria-pressed="true" aria-label="Hearts"></button>
    <button class="suit" data-suit="diamonds" aria-pressed="false" aria-label="Diamonds"></button>
    <button class="suit" data-suit="clubs" aria-pressed="false" aria-label="Clubs"></button>
    <button class="suit" data-suit="spades" aria-pressed="false" aria-label="Spades"></button>
  </div>

  <input type="file" id="fileInput" accept="image/*">

  <footer>Prints as 2.1 × 3.4 in · Made with love by Harsh and Jheel 💛</footer>
</main>

<script>
(() => {
  const W = 630, H = 1020;
  const INNER = { x: 30, y: 30, w: 570, h: 960, r: 26 };
  const TAB = { w: 122, h: 214, r: 26 };
  const COLORS = { red: '#c8102e', black: '#161616' };
  const SUITS = {
    hearts:   { color: COLORS.red,   name: 'Hearts' },
    diamonds: { color: COLORS.red,   name: 'Diamonds' },
    clubs:    { color: COLORS.black, name: 'Clubs' },
    spades:   { color: COLORS.black, name: 'Spades' },
  };

  const canvas = document.getElementById('card');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint');
  const zoomRow = document.getElementById('zoomRow');
  const zoomInput = document.getElementById('zoom');
  const exportRow = document.getElementById('exportRow');
  const shareBtn = document.getElementById('shareBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const title = document.querySelector('h1');

  let suit = 'hearts';
  let face = 'Queen';
  const FACE_LETTERS = { Queen: 'Q', King: 'K', Jack: 'J', Ace: 'A' };
  let photo = null;            // canvas holding the (possibly downscaled) photo
  let baseScale = 1;           // scale that makes the photo exactly cover INNER
  let zoom = 1;                // user zoom on top of baseScale
  let ox = 0, oy = 0;          // photo center offset from INNER center, in card px

  // ---------- suit shapes (unit box centered at 0,0, size 1) ----------
  function suitPath(p, s) {
    if (s === 'hearts') {
      p.moveTo(0, 0.42);
      p.bezierCurveTo(-0.08, 0.32, -0.5, 0.06, -0.5, -0.17);
      p.bezierCurveTo(-0.5, -0.4, -0.3, -0.5, -0.17, -0.5);
      p.bezierCurveTo(-0.07, -0.5, 0, -0.42, 0, -0.32);
      p.bezierCurveTo(0, -0.42, 0.07, -0.5, 0.17, -0.5);
      p.bezierCurveTo(0.3, -0.5, 0.5, -0.4, 0.5, -0.17);
      p.bezierCurveTo(0.5, 0.06, 0.08, 0.32, 0, 0.42);
      p.closePath();
    } else if (s === 'diamonds') {
      p.moveTo(0, -0.5);
      p.quadraticCurveTo(0.17, -0.2, 0.38, 0);
      p.quadraticCurveTo(0.17, 0.2, 0, 0.5);
      p.quadraticCurveTo(-0.17, 0.2, -0.38, 0);
      p.quadraticCurveTo(-0.17, -0.2, 0, -0.5);
      p.closePath();
    } else if (s === 'spades') {
      p.moveTo(0, -0.5);
      p.bezierCurveTo(-0.1, -0.36, -0.5, -0.12, -0.5, 0.1);
      p.bezierCurveTo(-0.5, 0.3, -0.33, 0.38, -0.2, 0.38);
      p.bezierCurveTo(-0.1, 0.38, -0.04, 0.33, -0.03, 0.29);
      p.quadraticCurveTo(-0.06, 0.42, -0.16, 0.5);
      p.lineTo(0.16, 0.5);
      p.quadraticCurveTo(0.06, 0.42, 0.03, 0.29);
      p.bezierCurveTo(0.04, 0.33, 0.1, 0.38, 0.2, 0.38);
      p.bezierCurveTo(0.33, 0.38, 0.5, 0.3, 0.5, 0.1);
      p.bezierCurveTo(0.5, -0.12, 0.1, -0.36, 0, -0.5);
      p.closePath();
    } else { // clubs
      const r = 0.2;
      circle(p, 0, -0.27, r);
      circle(p, -0.26, 0.08, r);
      circle(p, 0.26, 0.08, r);
      circle(p, 0, 0.02, 0.14);
      p.moveTo(-0.04, 0.05);
      p.quadraticCurveTo(-0.05, 0.38, -0.17, 0.5);
      p.lineTo(0.17, 0.5);
      p.quadraticCurveTo(0.05, 0.38, 0.04, 0.05);
      p.closePath();
    }
  }
  function circle(p, x, y, r) { p.moveTo(x + r, y); p.arc(x, y, r, 0, Math.PI * 2); p.closePath(); }

  function drawSuit(c, s, cx, cy, size, color) {
    c.save();
    c.translate(cx, cy);
    c.scale(size, size);
    c.beginPath();
    suitPath(c, s);
    c.fillStyle = color;
    c.fill('nonzero');
    c.restore();
  }

  // Suit icons for the picker buttons (SVG built from the same shapes via a tiny recorder)
  function suitSVG(s) {
    let d = '';
    const f = (n) => (Math.round((n + 0.5) * 1000) / 10).toFixed(1);
    const rec = {
      moveTo: (x, y) => d += `M${f(x)} ${f(y)}`,
      lineTo: (x, y) => d += `L${f(x)} ${f(y)}`,
      quadraticCurveTo: (a, b, x, y) => d += `Q${f(a)} ${f(b)} ${f(x)} ${f(y)}`,
      bezierCurveTo: (a, b, c2, e, x, y) => d += `C${f(a)} ${f(b)} ${f(c2)} ${f(e)} ${f(x)} ${f(y)}`,
      arc: (x, y, r) => { const R = r * 100; d += `M${f(x - r)} ${f(y)}a${R} ${R} 0 1 0 ${2 * R} 0a${R} ${R} 0 1 0 ${-2 * R} 0`; },
      closePath: () => d += 'Z',
    };
    // circle() calls moveTo before arc; the arc recorder restarts the subpath itself, so that's harmless
    suitPath(rec, s);
    return `<svg viewBox="0 0 100 100" aria-hidden="true"><path fill="${SUITS[s].color}" d="${d}"/></svg>`;
  }

  // ---------- geometry helpers ----------
  function roundRectPath(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function clampOffsets() {
    if (!photo) return;
    const dw = photo.width * baseScale * zoom;
    const dh = photo.height * baseScale * zoom;
    const mx = Math.max(0, (dw - INNER.w) / 2);
    const my = Math.max(0, (dh - INNER.h) / 2);
    ox = Math.min(mx, Math.max(-mx, ox));
    oy = Math.min(my, Math.max(-my, oy));
  }

      loadFile.t = setTimeout(() => hint.classList.remove('show'), 3500);
    };
    img.onerror = () => { URL.revokeObjectURL(url); alert("Sorry, that photo couldn't be opened. Try another one."); };
    img.src = url;
  }

  // ---------- drag / pinch ----------
  const pointers = new Map();
  let lastPinch = null;
  let moved = false;

  function toCard(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
  }

  function zoomAt(newZoom, px, py) {
    newZoom = Math.min(4, Math.max(1, newZoom));
    const f = newZoom / zoom;
    const icx = INNER.x + INNER.w / 2, icy = INNER.y + INNER.h / 2;
    ox = (icx + ox - px) * f + px - icx;
    oy = (icy + oy - py) * f + py - icy;
    zoom = newZoom;
    zoomInput.value = String(zoom);
    clampOffsets();
    render();
  }

  function pinchState() {
    const [a, b] = [...pointers.values()];
    return { d: Math.hypot(a.x - b.x, a.y - b.y), x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
  }

  canvas.addEventListener('pointerdown', (e) => {
    if (!photo) return;
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, toCard(e));
    moved = false;
    canvas.classList.add('dragging');
    if (pointers.size === 2) lastPinch = pinchState();
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId)) return;
    const prev = pointers.get(e.pointerId);
    const cur = toCard(e);
    pointers.set(e.pointerId, cur);
    if (pointers.size === 1) {
      ox += cur.x - prev.x;
      oy += cur.y - prev.y;
      if (Math.abs(cur.x - prev.x) + Math.abs(cur.y - prev.y) > 1) moved = true;
      clampOffsets();
      render();
    } else if (pointers.size === 2 && lastPinch) {
      const p = pinchState();
      ox += p.x - lastPinch.x;
      oy += p.y - lastPinch.y;
      moved = true;
      zoomAt(zoom * (p.d / Math.max(1, lastPinch.d)), p.x, p.y);
      lastPinch = p;
    }
    if (moved) hint.classList.remove('show');
  });
  function endPointer(e) {
    pointers.delete(e.pointerId);
    lastPinch = pointers.size === 2 ? pinchState() : null;
    if (pointers.size === 0) canvas.classList.remove('dragging');
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  canvas.addEventListener('click', () => { if (!photo) fileInput.click(); });

  canvas.addEventListener('wheel', (e) => {
    if (!photo) return;
    e.preventDefault();
    const p = toCard(e);
    zoomAt(zoom * Math.exp(-e.deltaY * 0.0015), p.x, p.y);
  }, { passive: false });

  zoomInput.addEventListener('input', () => {
    zoomAt(parseFloat(zoomInput.value), INNER.x + INNER.w / 2, INNER.y + INNER.h / 2);
  });

  // iOS Safari: stop the page from rubber-banding while pinching the card
  canvas.addEventListener('touchmove', (e) => { if (photo) e.preventDefault(); }, { passive: false });

  // ---------- export ----------
  function getBlob() {
    render();
    return new Promise((res) => canvas.toBlob(res, 'image/png'));
  }
  function fileName() { return 'jheel-2026-' + THEMES[theme].file() + '.png'; }

  downloadBtn.addEventListener('click', async () => {
    const blob = await getBlob();
    if (!blob) return;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName();
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  });

  const canShareFiles = (() => {
    try {
      return !!(navigator.share && navigator.canShare &&
        navigator.canShare({ files: [new File([new Blob(['x'], { type: 'image/png' })], 'x.png', { type: 'image/png' })] }));
    } catch (_) { return false; }
  })();
  if (canShareFiles) shareBtn.classList.remove('hidden');

  shareBtn.addEventListener('click', async () => {
    const blob = await getBlob();
    if (!blob) return;
    const file = new File([blob], fileName(), { type: 'image/png' });
    try {
      await navigator.share({ files: [file], title: "My card from Jheel's birthday" });
    } catch (err) {
      if (err && err.name !== 'AbortError') downloadBtn.click();
    }
  });

  // Draw once fonts are ready so the Q uses the serif face
  refreshTitle();
  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
})();
</script>
</body>
</html>
